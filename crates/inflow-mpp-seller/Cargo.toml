[package]
name = "inflow-mpp-seller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Seller integration for InFlow MPP payments."
readme = "README.md"
include = ["src/**", "tests/**", "README.md", "LICENSE"]

[features]
tower = ["mpp/tower"]

[dependencies]
inflow-core = { path = "../inflow-core", version = "0.4.1" }
inflow-mpp = { path = "../inflow-mpp", version = "0.4.1" }
mpp = { workspace = true, features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
time = { workspace = true, features = ["formatting"] }
tokio-util.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
bytes = "1"
http.workspace = true
http-body-util = "0.1"
reqwest.workspace = true
tokio = { workspace = true, features = ["test-util", "net", "io-util"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
