[package]
name = "inflow-x402-buyer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Buyer integration for InFlow x402 payments."
readme = "README.md"
include = ["src/**", "tests/**", "README.md", "LICENSE"]

[features]
default = []
evm = ["dep:alloy-eip7702", "dep:alloy-primitives", "dep:alloy-sol-types", "dep:x402-chain-eip155"]
solana = ["dep:x402-chain-solana"]

[dependencies]
alloy-eip7702 = { workspace = true, optional = true }
alloy-primitives = { workspace = true, optional = true, features = ["k256"] }
alloy-sol-types = { workspace = true, optional = true }
http.workspace = true
inflow-core = { path = "../inflow-core", version = "0.4.0" }
inflow-x402 = { path = "../inflow-x402", version = "0.4.0" }
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
x402-chain-eip155 = { workspace = true, optional = true }
x402-chain-solana = { workspace = true, optional = true }
x402-types.workspace = true

[dev-dependencies]
alloy-signer.workspace = true
alloy-signer-local.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["test-util", "net", "io-util"] }

[lints]
workspace = true
