[workspace]
resolver = "3"
members = [
    "conformance",
    "crates/inflow-core",
    "crates/inflow-tap-seller",
    "crates/inflow-mpp",
    "crates/inflow-mpp-buyer",
    "crates/inflow-mpp-seller",
    "crates/inflow-x402",
    "crates/inflow-x402-buyer",
    "crates/inflow-x402-seller",
    "crates/inflow-x402-axum",
    "examples",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
authors = ["Nas Kavian <nas@inflowpay.ai>"]
repository = "https://github.com/inflowpayai/inflow-rust"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
alloy-eip7702 = "0.6"
alloy-primitives = "1.6"
alloy-signer = "2"
alloy-signer-local = "2"
alloy-sol-types = "1.6"
base64 = "0.23"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "fast"] }
fastrand = "2"
futures-util = "0.3"
http = "1"
mpp = { version = "~0.15.0", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
x402-axum = { version = "~2.0.2", default-features = false }
x402-chain-eip155 = { version = "~2.0.2", default-features = false, features = ["client", "tracing"] }
x402-chain-solana = { version = "~2.0.2", default-features = false, features = ["client"] }
x402-types = { version = "~2.0.2", default-features = false }
