[workspace]
resolver = "3"
members = [
    "crates/inflow-core",
    "crates/inflow-mpp",
    "crates/inflow-mpp-buyer",
    "crates/inflow-mpp-seller",
    "crates/inflow-x402",
    "crates/inflow-x402-buyer",
    "crates/inflow-x402-seller",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
authors = ["Nas Kavian <nas@inflowpay.ai>"]
repository = "https://github.com/inflowpayai/inflow-rust"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
base64 = "0.22"
fastrand = "2"
futures-util = "0.3"
http = "1"
mpp = { version = "~0.14.0", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
x402-types = { version = "~2.0.2", default-features = false }
