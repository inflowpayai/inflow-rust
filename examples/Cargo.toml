inflow-x402-seller = { path = "../crates/inflow-x402-seller", version = "0.1.0" }
inflow-x402-axum = { path = "../crates/inflow-x402-axum", version = "0.1.0" }
reqwest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal", "io-util"] }
