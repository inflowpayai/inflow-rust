name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.93.0", stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Rust
        id: rust
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy,rustfmt,llvm-tools-preview
          rustup override set ${{ matrix.toolchain }}
          echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/**', 'Makefile', '.github/workflows/ci.yml') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps/*.*
            target/llvm-cov-target/debug/.fingerprint
            target/llvm-cov-target/debug/build
            target/llvm-cov-target/debug/deps/*.*
            target/consumer-check/debug/.fingerprint
            target/consumer-check/debug/build
            target/consumer-check/debug/deps/*.*
            !target/**/*.profraw
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.8,cargo-llvm-cov@0.8.7
          fallback: none
      - run: make verify
      - name: Verify packaged consumers
        run: |
          node scripts/release.mjs prepare "$RUNNER_TEMP/packages"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/consumer-check" node scripts/verify-consumer.mjs packages "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.toolchain }}
          path: lcov.info
          if-no-files-found: error

  conformance:
    name: conformance (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.93.0', stable]
    steps:
      - uses: actions/checkout@v7
        with:
          path: sdk
      - name: Read contract pin
        id: contract
        run: echo "revision=$(jq -r .revision sdk/conformance/inflow-specs.lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: inflowpayai/inflow-specs
          ref: ${{ steps.contract.outputs.revision }}
          path: contract
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: '11.20.0'
      - run: pnpm install --frozen-lockfile
        working-directory: contract
      - name: Install Rust
        working-directory: sdk
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustup override set ${{ matrix.toolchain }}
      - name: Run shared conformance
        working-directory: sdk
        run: |
          mkdir ../reports
          node scripts/conformance.mjs --contract-root ../contract --output-dir ../reports
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-${{ matrix.toolchain }}
          path: reports/*.json
          if-no-files-found: error

  codecov:
    if: github.repository == 'inflowpayai/inflow-rust'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: coverage-1.93.0
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
